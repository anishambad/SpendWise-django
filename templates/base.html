{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SpendWise{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-gray-50 text-gray-800 max-w-5xl min-h-screen flex flex-col">

    {% include 'partials/navbar.html' %}

    <main class="flex-1 w-full max-w-5xl mx-auto px-4 py-8">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 rounded-lg px-4 py-3 text-sm {% if message.tags == 'error' %}bg-red-100 text-red-800
                {% else %}bg-green-100 text-green-800{% endif %}">
                    {{message}}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>
    
    {% include 'partials/footer.html' %}
</body>
</html>
